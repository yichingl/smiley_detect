version: '3.8'

services:
  # 1. Redis Broker and Result Backend
  redis:
    image: redis:latest
    container_name: smiley_redis
    ports:
      - "6379:6379"

  # 2. FastAPI Web Application
  web:
    build: .
    container_name: smiley_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      # Maps the container's uploaded_images folder to your host machine's folder
      - ./uploaded_images:/app/uploaded_images

  # 3. Celery Background Worker
  worker:
    build: .
    container_name: smiley_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis