version: '3.8'

services:
  # 1. Redis Broker and Result Backend
  redis:
    image: redis:latest
    container_name: smiley_redis
    ports:
      - "6379:6379"

  # 2. FastAPI Web Application
  web:
    build: .
    container_name: smiley_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/smiley_app.db
    depends_on:
      - redis
    volumes:
      - smiley_uploads:/app/uploaded_images
      - smiley_data:/app/data
      - ./dataset:/app/dataset
      - ./saved_models:/app/saved_models

  # 3. Celery Background Worker
  worker:
    build: .
    container_name: smiley_worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/smiley_app.db
    depends_on:
      - redis
    volumes:
      - smiley_uploads:/app/uploaded_images
      - smiley_data:/app/data
      - ./dataset:/app/dataset
      - ./saved_models:/app/saved_models

volumes:
  smiley_uploads:
  smiley_data: